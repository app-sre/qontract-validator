[project]
name = "qontract-validator"
version = "0.1.0"
description = "Tools to validate and bundle datafiles for qontract-server"
authors = [
    { name = "Red Hat App-SRE Team", email = "sd-app-sre@redhat.com" },
]
license = { text = "Apache 2.0" }
requires-python = "~= 3.14.0"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==3.2.0",
]

[project.urls]
homepage = "https://github.com/app-sre/qontract-validator"
repository = "https://github.com/app-sre/qontract-validator"
documentation = "https://github.com/app-sre/qontract-validator"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest-cov==7.1.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
    "types-PyYAML==6.0.12.20260724",
    "types-jsonschema==3.2.1",
]

[project.scripts]
qontract-bundler = 'validator.bundler:main'
qontract-validator = 'validator.validator:main'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["validator"]

[tool.hatch.build.targets.wheel]
only-include = ["validator"]

# Ruff configuration
[tool.ruff]
line-length = 88
src = ["validator"]
extend-exclude = [
    ".local",
    ".cache",
    "tmp",
]
fix = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY",     # Missing copyright header
    "undocumented-public-module",    # Missing docstring in public module
    "undocumented-public-class",    # Missing docstring in public class
    "undocumented-public-method",    # Missing docstring in public method
    "undocumented-public-function",    # Missing docstring in public function
    "undocumented-public-package",    # Missing docstring in public package
    "undocumented-public-init",    # Missing docstring in __init__
    "incorrect-blank-line-before-class",    # 1 blank line required before class docstring
    "blank-line-before-class",    # No blank lines allowed before class docstring
    "multi-line-summary-first-line",    # multi-line-summary-first-line
    "multi-line-summary-second-line",    # multi-line-summary-second-line
    "D4",      # Doc string style
    "line-too-long",    # Line too long
    "too-many-public-methods", # Too many public methods
    "too-many-return-statements", # Too many return statements
    "too-many-branches", # Too many branches
    "too-many-arguments", # Too many arguments
    "too-many-locals", # Too many local variables
    "too-many-positional-arguments", # Too many positional arguments
    "too-many-nested-blocks", # Too many nested blocks
    "assert",    # Use of assert detected. Pytest uses assert
    "suspicious-subprocess-import",    # subprocess import
    "try-consider-else",  # try-consider-else
    # pydoclint
    "DOC",
    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "Q",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
]

[tool.ruff.format]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["validator"]

# Mypy configuration
[tool.mypy]
files = ["validator"]
enable_error_code = ["truthy-bool", "redundant-expr"]
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
